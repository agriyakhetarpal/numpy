name: Test Emscripten/Pyodide build

on:
  pull_request:
    branches:
      - main
      - maintenance/**
    paths-ignore:
      - '**.pyi'
      - '**.md'
      - '**.rst'
      - 'tools/stubtest/**'

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  build-wasm-emscripten:
    name: ${{ matrix.os }} ${{ matrix.build }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The job as it runs today, on both images
          - os: ubuntu-24.04
            build: cp314
            variant: baseline
          - os: ubuntu-26.04
            build: cp314
            variant: baseline
          # Drop LIBPC from the sysconfigdata of the xbuildenv
          - os: ubuntu-26.04
            build: cp314
            variant: no-libpc
          # Let pywasmcross add the Python include to preprocess-only calls
          - os: ubuntu-26.04
            build: cp314
            variant: pywasmcross-E
          # Both changes together, with the test suite
          - os: ubuntu-26.04
            build: cp314
            variant: no-libpc pywasmcross-E
            run-tests: true
          # An older Pyodide whose Python matches the system one on 24.04
          - os: ubuntu-22.04
            build: cp312
            variant: baseline
          - os: ubuntu-24.04
            build: cp312
            variant: baseline
          - os: ubuntu-24.04
            build: cp312
            variant: no-libpc
          # A host where pkg-config may know a Python outside /usr
          - os: macos-latest
            build: cp314
            variant: baseline
    steps:
      - name: Checkout NumPy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true
          persist-credentials: false

      - name: Show the host Python and pkg-config state
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set +e
          target="3.${BUILD#cp3}"
          echo "Target Python: ${target}"
          echo "Runner image version: ${ImageVersion}"
          which -a python3
          python3 --version
          which -a pkg-config
          pkg-config --version
          echo "::group::pkg-config default search path"
          pkg-config --variable pc_path pkg-config
          echo "::endgroup::"
          if [ "$RUNNER_OS" = "Linux" ]; then
            head -n 4 /etc/os-release
            echo "::group::Python pkg-config files in the default search path"
            ls -la /usr/lib/x86_64-linux-gnu/pkgconfig/ | grep -i python
            echo "::endgroup::"
            echo "::group::Installed Python development packages"
            dpkg -l | grep -E 'python3[0-9.]*-dev|libpython3'
            echo "::endgroup::"
          else
            sw_vers
            echo "::group::Python pkg-config files that Homebrew provides"
            ls -la "$(brew --prefix)"/lib/pkgconfig/ | grep -i python
            echo "::endgroup::"
          fi
          echo "pkg-config answer for python-${target}:"
          pkg-config --cflags "python-${target}"
          echo "exit code: $?"

      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: ${{ matrix.build }}-pyodide_wasm32
          CIBW_ENABLE: pyodide-prerelease pyodide-eol
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: bash {project}/tools/ci/emscripten/debug_before_build.sh
          # Only the build is under test, except where the matrix says so
          CIBW_TEST_SKIP: ${{ matrix.run-tests && ' ' || '*' }}
          DEBUG_VARIANT: ${{ matrix.variant }}

      - name: Show how meson looked for Python
        if: always()
        run: |
          log=build/meson-logs/meson-log.txt
          if [ ! -f "$log" ]; then
            echo "No meson log found"
            exit 0
          fi
          awk '/pkgconfig lookup/,/Has header "Python.h"/' "$log"
