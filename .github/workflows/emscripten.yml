name: Test Emscripten/Pyodide build

on:
  pull_request:
    branches:
      - main
      - maintenance/**
    paths-ignore:
      - '**.pyi'
      - '**.md'
      - '**.rst'
      - 'tools/stubtest/**'

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  build-wasm-emscripten:
    name: ${{ matrix.os }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The job as it runs today, on both images
          - os: ubuntu-24.04
            variant: baseline
          - os: ubuntu-26.04
            variant: baseline
          # Give 24.04 the system python-3.14.pc that 26.04 has
          - os: ubuntu-24.04
            variant: fake-system-pc
          # Take the system python-3.14.pc away from 26.04
          - os: ubuntu-26.04
            variant: no-system-pc
          # Keep pkg-config out of the system directories
          - os: ubuntu-26.04
            variant: pkg-config-libdir
          # Put a python-3.14.pc where LIBPC of the xbuildenv points
          - os: ubuntu-26.04
            variant: xbuildenv-pc
    steps:
      - name: Checkout NumPy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true
          persist-credentials: false

      - name: Show the host Python and pkg-config state
        run: |
          set +e
          head -n 4 /etc/os-release
          echo "Runner image version: ${ImageVersion}"
          which -a python3
          python3 --version
          which -a pkg-config
          pkg-config --version
          echo "::group::pkg-config default search path"
          pkg-config --variable pc_path pkg-config
          echo "::endgroup::"
          echo "::group::Python pkg-config files under /usr"
          find /usr -name 'python*.pc' -exec ls -la {} +
          echo "::endgroup::"
          echo "::group::Package that owns the system python-3.14.pc"
          dpkg -S /usr/lib/x86_64-linux-gnu/pkgconfig/python-3.14.pc
          echo "::endgroup::"
          echo "::group::Installed Python development packages"
          dpkg -l | grep -E 'python3[0-9.]*-dev|libpython3'
          echo "::endgroup::"
          echo "pkg-config answer for python-3.14:"
          pkg-config --cflags python-3.14
          echo "exit code: $?"

      - name: Add a stand-in system python-3.14.pc
        if: matrix.variant == 'fake-system-pc'
        run: |
          sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/python-3.14.pc << 'EOF'
          Name: Python
          Description: Stand-in for the file that ubuntu-26.04 has
          Version: 3.14
          Cflags: -I/usr/include/python3.14 -I/usr/include/x86_64-linux-gnu/python3.14
          EOF
          pkg-config --cflags python-3.14

      - name: Remove the system python-3.14.pc
        if: matrix.variant == 'no-system-pc'
        run: sudo find /usr -name 'python-3.14*.pc' -print -delete

      - name: Restrict pkg-config to an empty directory
        if: matrix.variant == 'pkg-config-libdir'
        run: |
          mkdir -p /tmp/empty-pkgconfig
          echo "PKG_CONFIG_LIBDIR=/tmp/empty-pkgconfig" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_ENABLE: pyodide-prerelease
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: bash {project}/tools/ci/emscripten/debug_before_build.sh
          # Only the build is under test here
          CIBW_TEST_SKIP: "*"
          DEBUG_VARIANT: ${{ matrix.variant }}

      - name: Show how meson looked for Python
        if: always()
        run: |
          log=build/meson-logs/meson-log.txt
          if [ ! -f "$log" ]; then
            echo "No meson log found"
            exit 0
          fi
          awk '/pkgconfig lookup/,/Has header "Python.h"/' "$log"
